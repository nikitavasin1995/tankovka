<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2B1D0E">
  <!-- пока сайт для друзей: не показывать в поисковиках (удалить строку, когда откроем для всех) -->
  <meta name="robots" content="noindex, nofollow">
  <title>Natankováno — танковое пиво на карте Чехии</title>
  <!-- установка на телефон: иконка на главном экране -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Natankováno">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🍺 Natankováno <small id="tagline">только танковое</small></div>
    <div class="top-right">
      <div id="chip"></div>
      <!-- выбор языка: видна короткая подпись, по нажатию открывается список языков -->
      <label class="lang"><span aria-hidden="true">🌐</span><span id="langCode">RU</span><select id="lang"></select></label>
    </div>
  </header>

  <main class="layout">
    <div id="map" aria-label="Карта пивных"></div>
    <div id="addHint" class="addhint" hidden>Нажмите на карту, где находится пивная</div>

    <section id="panel" class="panel">
      <nav class="tabs" role="tablist">
        <button role="tab" data-action="tab" data-tab="pubs">🗺 Пивные</button>
        <button role="tab" data-action="tab" data-tab="nearby">👥 Рядом</button>
        <button role="tab" data-action="tab" data-tab="me">🙂 Я</button>
      </nav>
      <div id="view"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="gate"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="data/pubs.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
